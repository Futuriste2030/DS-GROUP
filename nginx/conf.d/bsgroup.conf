# BS GROUP — Nginx configuration pour bsgroup.ml
# HTTP → HTTPS redirect + reverse proxy vers Gunicorn + static/media

# Upstream vers l'app Django (Gunicorn)
upstream bsgroup_web {
    server web:8000;
    keepalive 32;
}

# Rate limiting pour API chatbot
limit_req_zone $binary_remote_addr zone=chatbot_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP → HTTPS redirect + ACME challenge pour Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name bsgroup.ml www.bsgroup.ml;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://bsgroup.ml$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bsgroup.ml www.bsgroup.ml;

    # SSL (géré par certbot — chemins standards)
    ssl_certificate /etc/letsencrypt/live/bsgroup.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsgroup.ml/privkey.pem;

    # SSL moderne (Mozilla Intermediate 2024)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (1 an, includeSubDomains, preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — ajusté pour inline scripts/styles (preloader, i18n, chatbot)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://generativelanguage.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Fichiers statiques (servis par Nginx — cache long)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fichiers media (uploads utilisateur — cache court)
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Favicon & robots (cache long)
    location = /favicon.ico { alias /app/staticfiles/img/favicon/favicon.ico; access_log off; expires 1y; }
    location = /robots.txt { alias /app/staticfiles/robots.txt; access_log off; expires 1d; }
    location = /sitemap.xml { alias /app/staticfiles/sitemap.xml; access_log off; expires 1d; }

    # API Chatbot — rate limiting strict
    location /api/chat/ {
        limit_req zone=chatbot_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bsgroup_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API Cookie consent — rate limiting modéré
    location /api/cookie-consent/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bsgroup_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health check (pour orchestration)
    location = /health/ {
        access_log off;
        proxy_pass http://bsgroup_web;
        proxy_set_header Host $host;
    }

    # Tout le reste → Django (Gunicorn)
    location / {
        proxy_pass http://bsgroup_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (si nécessaire plus tard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Buffers pour gros uploads (CV, images)
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 20M;
    }

    # Error pages personnalisées (servies par Django)
    error_page 404 /404/;
    error_page 500 502 503 504 /500/;
    location = /404/ { internal; proxy_pass http://bsgroup_web; }
    location = /500/ { internal; proxy_pass http://bsgroup_web; }
}

# www → non-www redirect (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bsgroup.ml;

    ssl_certificate /etc/letsencrypt/live/bsgroup.ml/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bsgroup.ml/privkey.pem;

    return 301 https://bsgroup.ml$request_uri;
}