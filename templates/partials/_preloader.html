{% load static i18n %}
<div
  id="preloader"
  class="fixed inset-0 z-[200] flex flex-col items-center justify-center bg-white overflow-hidden"
  role="status"
  aria-label="{% trans 'Loading the website' %}"
>
  <!-- Hachures décoratives de fond -->
  <span class="preloader-hatch absolute inset-0" aria-hidden="true"></span>

  <!-- Crochet de grue : se lève pendant le chargement -->
  <div
    id="preloader-hook"
    class="relative z-10 will-change-transform"
    aria-hidden="true"
  >
    <div class="crane-hook">
      <svg viewBox="0 0 120 205" class="w-16 sm:w-[80px] h-auto" fill="none">
        <g stroke="#475569" stroke-width="2.5">
          <line x1="50" y1="0" x2="50" y2="52" />
          <line x1="60" y1="0" x2="60" y2="52" />
          <line x1="70" y1="0" x2="70" y2="52" />
        </g>
        <rect
          x="42"
          y="48"
          width="36"
          height="11"
          rx="5.5"
          fill="#334155"
        />
        <rect x="36" y="56" width="48" height="56" rx="13" fill="#c9a227" />
        <rect x="28" y="61" width="10" height="46" rx="5" fill="#0b1f35" />
        <rect x="82" y="61" width="10" height="46" rx="5" fill="#0b1f35" />
        <circle cx="60" cy="84" r="12" fill="#0b1f35" />
        <circle cx="60" cy="84" r="6" fill="#c9a227" />
        <circle cx="60" cy="84" r="2" fill="#0b1f35" />
        <rect
          x="55"
          y="112"
          width="10"
          height="14"
          rx="3.5"
          fill="#9aa8bc"
        />
        <path
          d="M60 124 L60 134 C58 150 42 154 38 168 C34 184 46 196 62 195 C78 194 88 183 86 169 C84.5 158 76 153 66 154"
          stroke="#5b6b80"
          stroke-width="14.5"
          stroke-linecap="round"
        />
        <path
          d="M60 124 L60 134 C58 150 42 154 38 168 C34 184 46 196 62 195 C78 194 88 183 86 169 C84.5 158 76 153 66 154"
          stroke="#9aa8bc"
          stroke-width="10.5"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </div>

  <!-- Logo marque -->
  <div class="site-logo relative z-10 mt-5 flex items-center gap-2.5">
    <img src="{% static 'img/logo/logo-bs-group.png' %}" alt="BS GROUP" />
  </div>
  <p
    class="relative z-10 mt-3 text-[11px] font-bold uppercase tracking-[3px] text-slate-400"
  >
    {% trans "Exchange · Finance · Infrastructures" %}
  </p>

  <!-- Règle graduée + barre de progression -->
  <div class="relative z-10 mt-9 w-56 sm:w-64 max-w-[80vw]">
    <span class="preloader-ruler block w-full" aria-hidden="true"></span>

    <div
      class="mt-2.5 h-1.5 w-full rounded-full bg-[#0b1f35]/10 overflow-hidden"
    >
      <div
        id="preloader-bar"
        class="h-full w-0 rounded-full bg-[#c9a227]"
        style="transition: width 0.15s ease-out"
      ></div>
    </div>

    <div
      class="mt-3 flex items-center justify-between text-[11px] font-semibold"
    >
      <span id="preloader-label" class="text-slate-500"
        >{% trans "Laying the foundation..." %}</span
      >
      <span id="preloader-percent" class="text-[#c9a227] tabular-nums"
        >0%</span
      >
    </div>
  </div>
</div>
