# BS GROUP — docker-compose production (SQLite)
# Usage: docker compose -f docker-compose.yml --env-file .env.prod up -d
# Le reverse proxy et le SSL sont gérés par aaPanel (Nginx système), pas par ce compose.

services:
  # Application Django (Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bsgroup-web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: sqlite:///data/db.sqlite3
      DJANGO_SETTINGS_MODULE: bsgroup.settings
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
      - sqlite_data:/data
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  staticfiles:
  media:
  sqlite_data:

networks:
  default:
    name: bsgroup-network