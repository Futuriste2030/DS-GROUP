# DS-GROUP — build, push to GHCR, deploy to VPS over SSH
# Required GitHub Secrets:
#   SSH_HOST  VPS IP/hostname (e.g. 57.128.198.117)
#   SSH_USER  SSH user on the VPS
#   SSH_PRIVATE_KEY  private key authorized on the VPS
#   ENV_PROD_FILE (optional but recommended)  full contents of .env.prod
# VPS prerequisites (once): docker + compose plugin, repo cloned at
# /var/www/ds-group, .env.prod beside docker-compose.yml
# (or ENV_PROD_FILE secret to auto-create it),
# GHCR login (docker login ghcr.io -u USER), aaPanel nginx reverse-proxy
# 127.0.0.1:8001 -> public domain + SSL.
name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases image name + tags :latest and :<sha>
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/ds-group
            # Le repo a pu etre clone en root : repare la propriete
            # (fonctionne si sudo NOPASSWD, sinon ignore — voir message plus bas)
            sudo -n chown -R "$(id -u):$(id -g)" . || true
            (git config --global --get-all safe.directory | grep -qxF /var/www/ds-group) || git config --global --add safe.directory /var/www/ds-group
            # Deploiement deterministe : aligne le VPS sur origin/main
            # (reset --hard ne touche pas aux fichiers non suivis comme .env.prod)
            git fetch origin main
            git reset --hard origin/main
            # Recreate .env.prod from secret if provided (keeps VPS file in sync)
            if [ -n "${{ secrets.ENV_PROD_FILE }}" ]; then
              printf '%s\n' "${{ secrets.ENV_PROD_FILE }}" > .env.prod
              chmod 600 .env.prod
            fi
            # Fail fast with a clear message instead of cryptic compose error
            if [ ! -f .env.prod ]; then
              echo "::error::Missing /var/www/ds-group/.env.prod on VPS. Create it from .env.prod.example or set ENV_PROD_FILE secret."
              exit 1
            fi
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps